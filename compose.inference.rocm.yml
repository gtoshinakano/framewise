services:
  # Build-only: the dependency stage (ROCm PyTorch and the model libraries) shared by both workers.
  # `scale: 0` means `up` never starts it; it is listed under the worker profiles so compose can build it first
  # for the audio worker (additional_contexts), also when COMPOSE_PROFILES is set.
  inference-deps:
    profiles: ["build-base", "inference", "audio"]
    scale: 0
    build:
      context: .
      dockerfile: Dockerfile.inference.rocm
      target: deps
    image: framewise-inference-rocm:deps
  inference-worker:
    profiles: ["inference"]
    build:
      context: .
      dockerfile: Dockerfile.inference.rocm
    image: framewise-inference-rocm:local
    restart: unless-stopped
    depends_on:
      video-analyzer:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      TMPDIR: /data/tmp
      WEVISONE_MODEL_PATH: /models/wevisone-4b
      ANIREF_MODEL_PATH: /models/aniref/AniRef40000-s-epoch40.pt
      ANIME_REID_MODEL_PATH: /models/anime-reid/dino_v3.onnx
      ANIME_REID_PROVIDER: ${ANIME_REID_PROVIDER:-torch-rocm}
      # ccip (default) or dinov3. Empty thresholds use the embedder's calibrated defaults.
      ANIME_REID_BACKEND: ${ANIME_REID_BACKEND:-ccip}
      CCIP_MODEL_DIR: /models/ccip
      CCIP_VARIANT: ${CCIP_VARIANT:-}
      ANIME_REID_MIN_SIMILARITY: ${ANIME_REID_MIN_SIMILARITY:-}
      ANIME_REID_MIN_MARGIN: ${ANIME_REID_MIN_MARGIN:-}
      LLAMA_SERVER_PATH: /models/llamacpp/llama-server
      # Inkling 2 Mini needs a newer llama.cpp (inkling2_loop) than the Qwen runtime above: scripts/build-llamacpp-inkling.sh
      # builds it into .models/llamacpp-inkling, python3 scripts/install-model.py inkling2-mini installs the files.
      INKLING_SERVER_PATH: /models/llamacpp-inkling/llama-server
      INKLING_MODEL_PATH: /models/inkling-2-mini/Inkling-2-Mini-UD-Q4_K_M.gguf
      INKLING_PROJECTOR_PATH: /models/inkling-2-mini/mmproj-F16.gguf
      # Optional visual model (Visual engine dialog); install with: python3 scripts/install-model.py lfm3-omni-2b
      LFM3_OMNI_MODEL_PATH: /models/lfm3-omni-2b/LFM3-Omni-2B-BF16.gguf
      LFM3_OMNI_PROJECTOR_PATH: /models/lfm3-omni-2b/mmproj-LFM3-Omni-2B-BF16.gguf
      # Keyframe analysis: DWPose body keypoints on the CPU (install with: python3 scripts/install-model.py dwpose; recreate this
      # container after the first install). Without them the keyframe stage runs on the vision model alone.
      DWPOSE_DIR: /models/dwpose
      DWPOSE_THREADS: ${DWPOSE_THREADS:-}
      # Keyframe windows described at once by the vision model's server (16384 tokens each); lower to 1 if the server fails to start.
      KEYFRAME_PARALLEL: ${KEYFRAME_PARALLEL:-2}
      QWEN36_MODEL_PATH: /models/qwen3.6-35b/Qwen3.6-35B-A3B-Q4_K_M.gguf
      # Vision projector of Qwen 3.6 (python3 scripts/install-model.py qwen36-vision). It makes Qwen 3.6 the default model of the
      # visual jobs (first frame, keyframes, character profile, subtitles) and lets Cut Assistance look at frames (view_frames).
      QWEN36_PROJECTOR_PATH: /models/qwen3.6-35b/mmproj-Qwen3.6-35B-A3B-BF16.gguf
      # 0 starts the chat/text server without the projector (no images in Cut Assistance; saves about 1-2 GB of VRAM).
      QWEN36_TEXT_VISION: ${QWEN36_TEXT_VISION:-1}
      # Same model with multi-token-prediction heads (speculative decoding); choose it in the text engine dialog.
      QWEN36_MTP_MODEL_PATH: /models/qwen3.6-35b-mtp/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      QWEN36_MTP_ARGS: ${QWEN36_MTP_ARGS:---spec-type draft-mtp --spec-draft-n-max 3}
      # One resident Qwen 3.6 server (MTP by default) serves text, pictures, subtitles and chat. QWEN36_SLOTS is its number of
      # parallel slots; empty means as many as the widest stage below needs (4). QWEN36_CONTEXT_SIZE is the KV pool; with
      # QWEN36_KV_UNIFIED=1 every slot shares it, so the extra slots do not shrink the room of a text job
      # (TEXT_JOB_CONCURRENCY slots of CONTEXT_SIZE / TEXT_JOB_CONCURRENCY tokens). Recreate this container after changing any of them.
      QWEN36_SLOTS: ${QWEN36_SLOTS:-}
      QWEN36_KV_UNIFIED: ${QWEN36_KV_UNIFIED:-1}
      QWEN36_CONTEXT_SIZE: ${QWEN36_CONTEXT_SIZE:-65536}
      QWEN36_THINKING_BUDGET: ${QWEN36_THINKING_BUDGET:-2048}
      TEXT_JOB_CONCURRENCY: ${TEXT_JOB_CONCURRENCY:-2}
      FRAME_PARALLEL: ${FRAME_PARALLEL:-4}
      SUBTITLE_READ_PARALLEL: ${SUBTITLE_READ_PARALLEL:-4}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ASSISTANT_ENDPOINTS: ${ASSISTANT_ENDPOINTS:-}
    volumes:
      - video_data:/data
      - model_cache:/models/cache
      - ${WEVISONE_MODEL_DIR:-./.models/wevisone-4b}:/models/wevisone-4b:ro
      - ${ANIREF_MODEL_DIR:-./.models/aniref}:/models/aniref:ro
      - ${ANIME_REID_MODEL_DIR:-./.models/anime-reid}:/models/anime-reid:ro
      - ${CCIP_MODEL_DIR:-./.models/ccip}:/models/ccip:ro
      - ${TEXT_MODEL_DIR:-./.models/qwen3.6-35b}:/models/qwen3.6-35b:ro
      - ${TEXT_MTP_MODEL_DIR:-./.models/qwen3.6-35b-mtp}:/models/qwen3.6-35b-mtp:ro
      - ${LLAMACPP_RUNTIME_DIR:-./.models/llamacpp-runtime}:/models/llamacpp:ro
      - ${LLAMACPP_INKLING_DIR:-./.models/llamacpp-inkling}:/models/llamacpp-inkling:ro
      - ${INKLING_MODEL_DIR:-./.models/inkling-2-mini}:/models/inkling-2-mini:ro
      - ${LFM3_OMNI_MODEL_DIR:-./.models/lfm3-omni-2b}:/models/lfm3-omni-2b:ro
      - ${DWPOSE_MODEL_DIR:-./.models/dwpose}:/models/dwpose:ro
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-991}"
    security_opt:
      - seccomp:unconfined
