services:
  inference-worker:
    profiles: ["inference"]
    build:
      context: .
      dockerfile: Dockerfile.inference.rocm
    image: framewise-inference-rocm:local
    restart: unless-stopped
    depends_on:
      video-analyzer:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      TMPDIR: /data/tmp
      WEVISONE_MODEL_PATH: /models/wevisone-4b
      ANIREF_MODEL_PATH: /models/aniref/AniRef40000-s-epoch40.pt
      ANIME_REID_MODEL_PATH: /models/anime-reid/dino_v3.onnx
      ANIME_REID_PROVIDER: ${ANIME_REID_PROVIDER:-torch-rocm}
      # ccip (default) or dinov3. Empty thresholds use the embedder's calibrated defaults.
      ANIME_REID_BACKEND: ${ANIME_REID_BACKEND:-ccip}
      CCIP_MODEL_DIR: /models/ccip
      CCIP_VARIANT: ${CCIP_VARIANT:-}
      ANIME_REID_MIN_SIMILARITY: ${ANIME_REID_MIN_SIMILARITY:-}
      ANIME_REID_MIN_MARGIN: ${ANIME_REID_MIN_MARGIN:-}
      CAPTION_MODEL_PATH: /models/qwen3-vl-2b
      QWEN3_VIDEO_MODEL_PATH: /models/qwen3-vl-8b
      QWEN35_SERVER_PATH: /models/llamacpp/llama-server
      QWEN35_MODEL_PATH: /models/qwen3.5-27b/Q4_K_M/Qwen3.5-27B-Q4_K_M.gguf
      QWEN35_PROJECTOR_PATH: /models/qwen3.5-27b/mmproj/mmproj-Qwen3.5-27B-BF16.gguf
      # Optional visual model (Visual engine dialog); install with: python3 scripts/install-model.py lfm3-omni-2b
      LFM3_OMNI_MODEL_PATH: /models/lfm3-omni-2b/LFM3-Omni-2B-BF16.gguf
      LFM3_OMNI_PROJECTOR_PATH: /models/lfm3-omni-2b/mmproj-LFM3-Omni-2B-BF16.gguf
      # Keyframe analysis: DWPose body keypoints on the CPU (install with: python3 scripts/install-model.py dwpose; recreate this
      # container after the first install). Without them the keyframe stage runs on Qwen3.5 alone.
      DWPOSE_DIR: /models/dwpose
      DWPOSE_THREADS: ${DWPOSE_THREADS:-}
      # Keyframe windows described at once by the Qwen3.5 server (16384 tokens each); lower to 1 if the server fails to start.
      KEYFRAME_PARALLEL: ${KEYFRAME_PARALLEL:-2}
      QWEN36_MODEL_PATH: /models/qwen3.6-35b/Qwen3.6-35B-A3B-Q4_K_M.gguf
      # Same model with multi-token-prediction heads (speculative decoding); choose it in the text engine dialog.
      QWEN36_MTP_MODEL_PATH: /models/qwen3.6-35b-mtp/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      QWEN36_MTP_ARGS: ${QWEN36_MTP_ARGS:---spec-type draft-mtp --spec-draft-n-max 3}
      QWEN36_CONTEXT_SIZE: ${QWEN36_CONTEXT_SIZE:-65536}
      QWEN36_THINKING_BUDGET: ${QWEN36_THINKING_BUDGET:-2048}
      TEXT_JOB_CONCURRENCY: ${TEXT_JOB_CONCURRENCY:-2}
      FRAME_PARALLEL: ${FRAME_PARALLEL:-4}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ASSISTANT_ENDPOINTS: ${ASSISTANT_ENDPOINTS:-}
    volumes:
      - video_data:/data
      - model_cache:/models/cache
      - ${WEVISONE_MODEL_DIR:-./.models/wevisone-4b}:/models/wevisone-4b:ro
      - ${ANIREF_MODEL_DIR:-./.models/aniref}:/models/aniref:ro
      - ${ANIME_REID_MODEL_DIR:-./.models/anime-reid}:/models/anime-reid:ro
      - ${CCIP_MODEL_DIR:-./.models/ccip}:/models/ccip:ro
      - ${CAPTION_MODEL_DIR:-./.models/qwen3-vl-2b}:/models/qwen3-vl-2b:ro
      - ${VIDEO_MODEL_DIR:-./.models/qwen3-vl-8b}:/models/qwen3-vl-8b:ro
      - ${FRAME_MODEL_DIR:-./.models/qwen3.5-27b}:/models/qwen3.5-27b:ro
      - ${TEXT_MODEL_DIR:-./.models/qwen3.6-35b}:/models/qwen3.6-35b:ro
      - ${TEXT_MTP_MODEL_DIR:-./.models/qwen3.6-35b-mtp}:/models/qwen3.6-35b-mtp:ro
      - ${LLAMACPP_RUNTIME_DIR:-./.models/llamacpp-runtime}:/models/llamacpp:ro
      - ${LFM3_OMNI_MODEL_DIR:-./.models/lfm3-omni-2b}:/models/lfm3-omni-2b:ro
      - ${DWPOSE_MODEL_DIR:-./.models/dwpose}:/models/dwpose:ro
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-991}"
    security_opt:
      - seccomp:unconfined
