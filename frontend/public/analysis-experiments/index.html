<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose Experiment Report</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --border: #d9dde3; --text: #1b1f27; --muted: #5d6675; --soft: #eef1f5;
  --a1: #2563eb; --a2: #9333ea; --a3: #0d9488;
  --pass: #15803d; --pass-bg: #dcfce7; --fail: #b91c1c; --fail-bg: #fee2e2; --warn: #a16207; --warn-bg: #fef3c7;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #181c24; --border: #2c3340; --text: #e7eaf0; --muted: #98a2b3; --soft: #222833;
    --a1: #60a5fa; --a2: #c084fc; --a3: #2dd4bf;
    --pass: #4ade80; --pass-bg: #12301f; --fail: #f87171; --fail-bg: #3a1618; --warn: #fbbf24; --warn-bg: #33270b;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #181c24; --border: #2c3340; --text: #e7eaf0; --muted: #98a2b3; --soft: #222833;
  --a1: #60a5fa; --a2: #c084fc; --a3: #2dd4bf;
  --pass: #4ade80; --pass-bg: #12301f; --fail: #f87171; --fail-bg: #3a1618; --warn: #fbbf24; --warn-bg: #33270b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.35rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 28px 0 10px; }
h3 { font-size: 1rem; margin: 0 0 6px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.mono { font-family: var(--mono); font-size: .85rem; }
header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
select, button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
button.on { background: var(--soft); border-color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.chip { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .78rem; border: 1px solid var(--border); background: var(--soft); white-space: nowrap; }
.chip.pass, .ok { color: var(--pass); background: var(--pass-bg); border-color: transparent; }
.chip.fail, .bad { color: var(--fail); background: var(--fail-bg); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.bar { height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--muted); }
.score { font-size: 2.6rem; font-weight: 700; line-height: 1; }
.a1 { --c: var(--a1); } .a2 { --c: var(--a2); } .a3 { --c: var(--a3); }
.card.approach { border-top: 4px solid var(--c); }
.card.approach .score, .tag { color: var(--c); }
.card.approach .bar > i { background: var(--c); }
.parts { display: grid; grid-template-columns: 92px 1fr 40px; gap: 4px 8px; align-items: center; margin: 10px 0; font-size: .85rem; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: .85rem; margin-top: 8px; }
.stats b { font-weight: 600; }
.winner { float: right; }
ul.tight { margin: 4px 0 8px; padding-left: 18px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 4px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; font-size: .85rem; }
th { font-weight: 600; background: var(--soft); position: sticky; top: 0; }
.scroll { overflow-x: auto; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.h-good { background: var(--pass-bg); } .h-mid { background: var(--warn-bg); } .h-bad { background: var(--fail-bg); }
details.sample { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
details.sample > summary { cursor: pointer; padding: 10px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; list-style: none; }
details.sample > summary::-webkit-details-marker { display: none; }
details.sample > summary img { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; background: var(--soft); }
.sum-main { flex: 1 1 260px; min-width: 0; }
.sum-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.detail { padding: 0 12px 12px; }
.detail .cols { display: grid; gap: 14px; grid-template-columns: minmax(260px, 420px) 1fr; }
@media (max-width: 800px) { .detail .cols { grid-template-columns: 1fr; } }
.detail img.frame { width: 100%; border-radius: 8px; background: var(--soft); }
.tabs { display: flex; gap: 6px; margin: 4px 0 10px; flex-wrap: wrap; }
.block { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.attempt { font-size: .82rem; margin: 2px 0; }
.attempt.err { color: var(--fail); }
.pose td.v { white-space: nowrap; }
.pose td.f { box-shadow: inset 0 0 0 2px var(--fail); border-radius: 4px; }
.pose td.p { box-shadow: inset 0 0 0 2px var(--pass); border-radius: 4px; }
.pose td.dim, .dim { color: var(--muted); font-style: italic; }
.conf { color: var(--muted); font-size: .75rem; margin-left: 4px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
pre { background: var(--soft); border-radius: 8px; padding: 8px; overflow: auto; max-height: 320px; font-size: .78rem; }
.verdict { font-weight: 700; }
.verdict.adopt { color: var(--pass); } .verdict.adopt_with_changes { color: var(--warn); } .verdict.not_ready { color: var(--fail); }
.empty { padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Pose experiment report</h1>
      <div class="muted small">Do Qwen3.5-27B (first frame) and Qwen3-VL-8B (video) give a reliable per-character head, gaze and body block?</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <label class="small muted" for="run">Run</label>
      <select id="run"></select>
      <button id="theme" title="Switch light / dark">◐</button>
    </div>
  </header>
  <section id="status" class="card" style="margin-top:12px"></section>
  <div id="content"></div>
</main>
<script>
'use strict';
const AP = ['full_confidence', 'top5_confidence', 'strict_detailed'];
const SHORT = { full_confidence: 'A1', top5_confidence: 'A2', strict_detailed: 'A3' };
const CLS = { full_confidence: 'a1', top5_confidence: 'a2', strict_detailed: 'a3' };
const STAGE_NAMES = { sample: 'Cuts', frames: 'First frames', video: 'Video', conclude: 'Conclusions' };
const state = { runs: [], runId: null, data: null, open: new Set(), tab: {}, fieldStage: 'frame', signatures: {}, timer: null };
const $ = (selector) => document.querySelector(selector);
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (value) => (value == null ? '—' : Math.round(value * 100) + '%');
const num = (value, digits = 1) => (value == null ? '—' : Number(value).toFixed(digits));
const secs = (value) => (value == null ? '—' : value >= 90 ? Math.floor(value / 60) + ' min ' + Math.round(value % 60) + ' s' : Math.round(value) + ' s');
const heat = (value) => (value == null ? '' : value >= 0.75 ? 'h-good' : value >= 0.5 ? 'h-mid' : 'h-bad');
async function getJSON(url) {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error(url + ' → ' + response.status);
  return response.json();
}

// ---- header and status ----
function renderStatus() {
  const data = state.data, progress = data.progress || {};
  const running = ['running', 'starting'].includes(progress.status);
  const started = progress.started_at ? Date.parse(progress.started_at) : null;
  const end = running ? Date.now() : (progress.updated_at ? Date.parse(progress.updated_at) : Date.now());
  const chips = Object.entries(progress.stages || {}).map(([name, s]) => {
    const kind = s.status === 'done' ? 'pass' : s.status === 'failed' ? 'fail' : s.status === 'running' ? 'warn' : '';
    const count = s.total ? ` ${s.done || 0}/${s.total}` : '';
    return `<span class="chip ${kind}" title="${esc(s.message || '')}">${esc(STAGE_NAMES[name] || name)}${count}</span>`;
  }).join('');
  const current = progress.stages && progress.current && progress.stages[progress.current];
  const percent = current && current.total ? Math.round(100 * (current.done || 0) / current.total) : (progress.status === 'done' ? 100 : 0);
  $('#status').innerHTML = `
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between">
      <div><b>${esc(data.run_id)}</b> ${data.config && data.config.dry ? '<span class="chip warn">dry run, fake models</span>' : ''}
        <span class="chip ${progress.status === 'done' ? 'pass' : progress.status === 'failed' ? 'fail' : 'warn'}">${esc(progress.status || 'unknown')}</span></div>
      <div class="muted small">${started ? 'elapsed ' + secs((end - started) / 1000) : ''} · updated ${esc((data.updated_at || '').replace('T', ' ').slice(0, 19))} UTC${running ? ' · refreshing every 15 s' : ''}</div>
    </div>
    <div class="stages">${chips}</div>
    <div class="bar" style="margin-top:8px"><i style="width:${percent}%"></i></div>
    ${progress.message ? `<div class="small bad" style="margin-top:6px">${esc(progress.message)}</div>` : ''}
    ${current && current.message && running ? `<div class="small muted" style="margin-top:6px">Now: ${esc(current.message)}</div>` : ''}`;
}

// ---- scoreboard ----
function combinedParts(approach) {
  const stages = approach.stage_scores, weights = state.data.stage_weights;
  const live = Object.keys(weights).filter((s) => stages[s]);
  const total = live.reduce((sum, s) => sum + weights[s], 0) || 1;
  const parts = {};
  for (const name of ['reliability', 'quality', 'coverage', 'efficiency']) parts[name] = live.reduce((sum, s) => sum + weights[s] * (stages[s].parts[name] || 0), 0) / total;
  return parts;
}
function renderConclusion(conclusion) {
  if (!conclusion) return '<div class="muted small" style="margin-top:10px">Qwen 3.6 has not written the conclusion yet.</div>';
  if (!conclusion.ok) return `<div class="bad small" style="margin-top:10px">Conclusion failed: ${esc(conclusion.error || 'invalid answer')}</div>`;
  const v = conclusion.value, list = (items) => `<ul class="tight">${(items || []).map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;
  return `<div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px">
    <div class="small muted">Conclusion written by Qwen 3.6 (${conclusion.attempts.length} attempt${conclusion.attempts.length > 1 ? 's' : ''}, ${secs(conclusion.seconds)})</div>
    <div class="verdict ${esc(v.verdict)}">${esc(v.verdict.replace(/_/g, ' '))}</div>
    <div><b>${esc(v.headline)}</b></div>
    <div class="small" style="margin-top:4px"><b>Strengths</b>${list(v.strengths)}<b>Weaknesses</b>${list(v.weaknesses)}</div>
    <div class="small"><span class="ok chip">reliable</span> ${esc((v.reliable_fields || []).join(', ') || '—')}</div>
    <div class="small" style="margin-top:3px"><span class="bad chip">weak</span> ${esc((v.unreliable_fields || []).join(', ') || '—')}</div>
    <p class="small" style="margin:8px 0 0">${esc(v.recommendation)}</p></div>`;
}
function renderScoreboard() {
  const data = state.data;
  const ranked = AP.filter((a) => data.approaches[a]).sort((x, y) => (data.approaches[y].final ?? -1) - (data.approaches[x].final ?? -1));
  const best = ranked[0];
  const cards = ranked.map((a) => {
    const block = data.approaches[a], parts = combinedParts(block), f = block.summary.frame, v = block.summary.video;
    const failures = f.validator_failures + v.validator_failures, retries = f.retries + v.retries, hard = f.hard_failures + v.hard_failures;
    const calls = f.main_calls + v.main_calls;
    const tokens = (f.completion_tokens + v.completion_tokens) / Math.max(f.attempts + v.attempts, 1);
    const rows = [['Reliability', parts.reliability, '30%'], ['Quality', parts.quality, '40%'], ['Coverage', parts.coverage, '15%'], ['Efficiency', parts.efficiency, '15%']]
      .map(([label, value, weight]) => `<span title="weight ${weight}">${label}</span><div class="bar"><i style="width:${Math.round(100 * value)}%"></i></div><span class="num">${pct(value)}</span>`).join('');
    return `<div class="card approach ${CLS[a]}">
      ${a === best && block.final != null && data.approaches[best].summary.frame.calls ? '<span class="chip pass winner">highest score</span>' : ''}
      <h3>${esc(block.label)}</h3><div class="muted small">${esc(block.note)}</div>
      <div style="display:flex; align-items:baseline; gap:12px; margin-top:8px"><div class="score">${num(block.final)}</div><div class="muted small">/ 100 final score<br>
        frame ${num(block.stage_scores.frame && block.stage_scores.frame.score)} · video ${num(block.stage_scores.video && block.stage_scores.video.score)}</div></div>
      <div class="parts">${rows}</div>
      <div class="stats">
        <span>Execution time</span><b>${secs(f.seconds + v.seconds)}</b>
        <span>· first frames / video</span><span>${secs(f.seconds)} / ${secs(v.seconds)}</span>
        <span>· mirror probe</span><span>${secs(f.probe_seconds)}</span>
        <span>Validator failures</span><b class="${failures ? 'bad' : 'ok'}">${failures}</b>
        <span>Retries</span><b>${retries}</b>
        <span>Hard failures (3 tries)</span><b class="${hard ? 'bad' : 'ok'}">${hard}</b>
        <span>First-try valid</span><span>${pct(f.first_try_rate)} frames · ${pct(v.first_try_rate)} video</span>
        <span>Tokens per attempt</span><span>${Math.round(tokens) || '—'}</span>
        <span>Calls</span><span>${calls}</span></div>
      ${renderConclusion(block.conclusion)}</div>`;
  }).join('');
  const overall = data.overall_conclusion;
  let overallHtml = '<div class="card"><h3>Overall conclusion (Qwen 3.6)</h3><div class="muted small">Not written yet.</div></div>';
  if (overall && overall.ok) {
    const v = overall.value, list = (items) => `<ul class="tight">${(items || []).map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;
    overallHtml = `<div class="card"><h3>Overall conclusion (Qwen 3.6)</h3>
      <div><b>${esc(v.headline)}</b></div>
      <div class="small" style="margin:4px 0">Best approach by this run: <span class="chip ${CLS[v.best_approach]}"><b>${esc((data.approaches[v.best_approach] || {}).label || v.best_approach)}</b></span></div>
      <p class="small">${esc(v.reasoning)}</p>
      <div class="small"><span class="ok chip">worth adding</span> ${esc((v.fields_to_add || []).join(', ') || '—')}</div>
      <div class="small" style="margin-top:3px"><span class="bad chip">not yet</span> ${esc((v.fields_to_avoid || []).join(', ') || '—')}</div>
      <div class="small" style="margin-top:6px"><b>Next steps</b>${list(v.next_steps)}<b>Caveats</b>${list(v.caveats)}</div></div>`;
  } else if (overall) overallHtml = `<div class="card"><h3>Overall conclusion (Qwen 3.6)</h3><div class="bad small">Failed: ${esc(overall.error || 'invalid answer')}</div></div>`;
  const w = data.weights;
  return `<h2>Scoreboard</h2><div class="grid">${cards}</div><div style="margin-top:12px">${overallHtml}</div>
    <details class="card" data-keep="how" style="margin-top:12px"><summary><b>How the score is built</b></summary>
      <p class="small">Final score = ${Math.round(100 * data.stage_weights.frame)}% first-frame stage + ${Math.round(100 * data.stage_weights.video)}% video stage. Each stage: reliability ${Math.round(100 * w.reliability)}%
      (half first-try valid, half valid after retries), quality ${Math.round(100 * w.quality)}%, coverage ${Math.round(100 * w.coverage)}% (concrete values returned ÷ the 13 fields asked for, so the top-5 style is capped by design),
      efficiency ${Math.round(100 * w.efficiency)}% (fastest approach's time ÷ this approach's time).</p>
      <p class="small"><b>Quality has no hand-labelled truth.</b> It is the mean of three pass rates: <b>mirror</b> (the left-right flipped frame must give negated yaw, swapped left/right gaze and roll, same everything else),
      <b>geometry</b> (who looks at whom must fit the character boxes; camera gaze; shot size against box height; one camera elevation per frame; pitch against vertical gaze; head against body)
      and <b>agreement</b> with the earlier free-text analysis of the same cut. Validator failures and retries also count the flipped-frame calls. A high score means <i>consistent</i>, not proven correct. Look at the frames below to judge a few cases yourself.</p></details>`;
}

// ---- field table ----
function renderFields() {
  const data = state.data, stage = state.fieldStage;
  const head = AP.map((a) => `<th colspan="5" class="tag ${CLS[a]}" style="text-align:center">${SHORT[a]}</th>`).join('');
  const sub = AP.map(() => '<th>cover</th><th>mirror</th><th>geom.</th><th>agree</th><th>conf.</th>').join('');
  const rows = data.fields.map((field) => {
    const cells = AP.map((a) => {
      const row = (data.approaches[a].summary[stage] || {}).fields?.[field] || {};
      const cell = (value, tint = true) => `<td class="num ${tint ? heat(value) : ''}">${pct(value)}</td>`;
      return cell(row.coverage, false) + cell(row.mirror) + cell(row.geometry) + cell(row.agreement) + `<td class="num">${row.mean_conf == null ? '—' : row.mean_conf.toFixed(2)}</td>`;
    }).join('');
    return `<tr><td class="mono">${field}</td>${cells}</tr>`;
  }).join('');
  return `<h2>Per field</h2><div class="muted small">Coverage = concrete values returned (not omitted, not "unclear"). Mirror, geometry and agreement are pass rates of the checks that touch that field (— = no check applies). Conf. = mean confidence the model reported.</div>
    <div class="tabs" style="margin-top:8px"><button data-stage="frame" class="${stage === 'frame' ? 'on' : ''}">First frame</button><button data-stage="video" class="${stage === 'video' ? 'on' : ''}">Video</button></div>
    <div class="card scroll"><table><thead><tr><th rowspan="2">field</th>${head}</tr><tr>${sub}</tr></thead><tbody>${rows}</tbody></table></div>
    ${renderAgreement()}`;
}
function renderAgreement() {
  const matrix = state.data.agreement_between || {};
  const rows = AP.map((a) => `<tr><td class="tag ${CLS[a]}"><b>${SHORT[a]}</b></td>${AP.map((b) => {
    const cell = (matrix[a] || {})[b];
    return `<td class="num ${cell ? heat(cell.rate) : ''}">${a === b ? '' : cell ? pct(cell.rate) + ' <span class="muted">n=' + cell.n + '</span>' : '—'}</td>`;
  }).join('')}</tr>`).join('');
  const a2 = state.data.approaches.top5_confidence.a2_choices || {};
  const choices = Object.entries(a2).sort((x, y) => y[1] - x[1]).map(([name, count]) => `<span class="chip">${name} ${count}</span>`).join(' ');
  return `<div class="grid" style="margin-top:12px"><div class="card"><h3>Agreement between approaches</h3><div class="muted small">Same cut, character and field, first frame: how often two approaches give the same value (angles within 25°).</div>
    <table><thead><tr><th></th>${AP.map((a) => `<th>${SHORT[a]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card"><h3>Fields the top-5 style chooses</h3><div class="muted small">How often each field was among the five the model was surest about.</div><div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px">${choices || '<span class="muted small">no data yet</span>'}</div></div></div>`;
}

// ---- samples ----
const callsOf = (a, id) => {
  const calls = state.data.approaches[a].calls;
  return { normal: (calls.frame[id] || {}).normal, mirror: (calls.frame[id] || {}).mirror, video: calls.video[id] };
};
function sampleSignature(id) {
  return AP.map((a) => { const c = callsOf(a, id); return [c.normal, c.mirror, c.video].map((x) => (x ? x.finished_at : 0)).join(','); }).join('|') + '|' + (state.tab[id] || '');
}
function checkTally(calls) {
  let pass = 0, total = 0;
  for (const call of calls) for (const check of (call && call.checks) || []) { total += 1; pass += check.status === 'pass' ? 1 : 0; }
  return [pass, total];
}
function sampleSummary(sample) {
  const chips = AP.map((a) => {
    const c = callsOf(a, sample.id);
    if (!c.normal && !c.video) return `<span class="chip ${CLS[a]}">${SHORT[a]} pending</span>`;
    const [pass, total] = checkTally([c.normal, c.video]);
    const frame = c.normal ? (c.normal.ok ? `frame ${c.normal.attempts.length > 1 ? '↻' + (c.normal.attempts.length - 1) : '✓'}` : 'frame ✗') : 'frame …';
    const video = c.video ? (c.video.ok ? `video ${c.video.windows.some((w) => w.attempts.length > 1) ? '↻' : '✓'}` : 'video ✗') : 'video …';
    const bad = (c.normal && !c.normal.ok) || (c.video && !c.video.ok);
    return `<span class="chip ${bad ? 'fail' : ''}" title="${SHORT[a]}: ${frame}, ${video}; checks passed ${pass}/${total}"><b class="tag ${CLS[a]}">${SHORT[a]}</b> ${frame} · ${video} · ${total ? pass + '/' + total : 'no checks'}</span>`;
  }).join('');
  return `<img loading="lazy" src="runs/${esc(state.runId)}/${esc(sample.thumb)}" alt="first frame of ${esc(sample.id)}">
    <div class="sum-main"><b>${esc(sample.id)}</b> · ${esc(sample.episode)} cut ${sample.cut_index} · ${num(sample.duration)} s · ${sample.marked.length} character${sample.marked.length === 1 ? '' : 's'}
    <div class="muted small">${esc(sample.reason)}</div></div><div class="sum-chips">${chips}</div>`;
}
function poseTable(entries, labelKey, checks, failed) {
  if (!entries || !entries.length) return '<div class="muted small">No characters were asked about (nobody marked in this frame).</div>';
  const marks = {};
  for (const check of checks || []) for (const field of check.fields || []) {
    const key = check.character + '|' + field;
    marks[key] = marks[key] === 'f' || check.status === 'fail' ? 'f' : 'p';
  }
  const fields = state.data.fields;
  const head = entries.map((entry) => `<th>${esc(entry[labelKey] ?? '?')}</th>`).join('');
  const body = fields.map((field) => `<tr><td class="mono muted">${field}</td>${entries.map((entry) => {
    if (!(field in entry)) return '<td class="dim">–</td>';
    const value = entry[field], conf = entry.confidence && entry.confidence[field];
    const abstained = value == null || value === 'unclear';
    const mark = marks[entry[labelKey] + '|' + field] || '';
    return `<td class="v ${abstained ? 'dim' : ''} ${mark}">${esc(value == null ? 'null' : value)}${conf != null ? `<span class="conf">${conf.toFixed(2)}</span>` : ''}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="scroll"><table class="pose"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>${failed ? '<div class="small bad">Rejected by the validator after the last attempt; the table shows the last parsed answer.</div>' : ''}`;
}
function attemptsHtml(attempts) {
  return attempts.map((x) => `<div class="attempt ${x.errors.length ? 'err' : ''}">Attempt ${x.n}: ${num(x.seconds)} s, ${x.prompt_tokens ?? '?'} → ${x.completion_tokens ?? '?'} tokens${x.errors.length ? ' · rejected:<ul class="tight">' + x.errors.map((e) => `<li>${esc(e)}</li>`).join('') + '</ul>' : ' · accepted'}</div>`).join('');
}
function rawHtml(attempts) {
  const last = attempts[attempts.length - 1];
  return last ? `<details><summary class="small muted">Raw model answer (${attempts.length > 1 ? 'last of ' + attempts.length + ' attempts' : 'accepted'})</summary><pre>${esc(last.raw)}</pre></details>` : '';
}
function checksHtml(checks) {
  if (!checks || !checks.length) return '<div class="muted small">No checks applied (an empty or abstained answer).</div>';
  return `<div class="checks">${checks.map((c) => `<span class="chip ${c.status}" title="${esc(c.detail)}">${esc(c.kind)}/${esc(c.name)} · ${esc(c.character)}${c.moment ? ' ' + c.moment : ''}</span>`).join('')}</div>
    <details><summary class="small muted">Check details</summary><ul class="tight small">${checks.map((c) => `<li class="${c.status === 'fail' ? 'bad' : ''}">${esc(c.status)} · ${esc(c.kind)}/${esc(c.name)} · ${esc(c.character)} — ${esc(c.detail)}</li>`).join('')}</ul></details>`;
}
function frameBlock(call, sample, variant) {
  if (!call) return `<div class="block muted small">${variant === 'mirror' ? 'Flipped frame' : 'First frame'}: not run yet.</div>`;
  const entries = call.ok ? call.answer : call.last_answer;
  const title = variant === 'mirror' ? 'Flipped frame (mirror probe)' : 'First frame';
  const note = variant === 'mirror' && call.mirror_map ? `<div class="muted small">Handles on the flipped frame (new → original): ${esc(Object.entries(call.mirror_map).map(([n, o]) => n + '→' + o).join(', ') || 'none')}. Its checks are in the first-frame block as <i>mirror/…</i>.</div>` : '';
  return `<div class="block"><h3>${title} <span class="chip ${call.ok ? 'pass' : 'fail'}">${call.ok ? 'valid' : 'invalid'}</span> <span class="muted small">${num(call.seconds)} s · ${call.attempts.length} attempt${call.attempts.length > 1 ? 's' : ''}</span></h3>
    ${attemptsHtml(call.attempts)}${note}${poseTable(entries, 'character_id', variant === 'mirror' ? [] : call.checks, !call.ok)}${variant === 'mirror' ? '' : checksHtml(call.checks)}${rawHtml(call.attempts)}</div>`;
}
function videoBlock(call) {
  if (!call) return '<div class="block muted small">Video: not run yet.</div>';
  const windows = call.windows.map((w) => {
    const plain = (w.answer || []).flatMap((item) => ['start', 'end'].map((moment) => ({ ...(item[moment] || {}), character: item.character + ' · ' + moment, _empty: !item[moment] })));
    const checks = (call.checks || []).filter((c) => c.window === w.index).map((c) => ({ ...c, character: c.character + ' · ' + c.moment }));
    return `<div style="margin-top:8px"><b>Window ${w.index + 1}</b> <span class="muted small">${num(w.start, 2)} s + ${num(w.duration, 2)} s · ${w.attempts.length} attempt${w.attempts.length > 1 ? 's' : ''}</span> <span class="chip ${w.ok ? 'pass' : 'fail'}">${w.ok ? 'valid' : 'invalid'}</span>
      ${w.overview ? `<div class="small muted">${esc(w.overview)}</div>` : ''}${attemptsHtml(w.attempts)}${w.ok ? poseTable(plain.map((e) => (e._empty ? { character: e.character } : e)), 'character', checks, false) : ''}${rawHtml(w.attempts)}</div>`;
  }).join('');
  return `<div class="block"><h3>Video <span class="chip ${call.ok ? 'pass' : 'fail'}">${call.ok ? 'valid' : 'invalid'}</span> <span class="muted small">${secs(call.seconds)} · ${call.windows.length} window${call.windows.length === 1 ? '' : 's'}</span></h3>
    ${call.error ? `<div class="small bad">${esc(call.error)}</div>` : ''}${windows}${checksHtml(call.checks)}</div>`;
}
function storedHtml(sample) {
  const first = sample.stored.first_frame, video = sample.stored.video, base = sample.stored.baseline;
  const rows = (first.characters || []).map((c) => `<tr><td>${esc(c.character)}</td><td>${esc(c.pose)}</td><td>${esc(c.expression)}</td><td>${esc(c.emotion)}</td><td>${esc(c.gaze)}</td><td>${esc(c.action)}</td></tr>`).join('');
  const motion = (video.characters || []).map((c) => `<li><b>${esc(c.character)}</b>: ${esc(c.activity)} · ${esc(c.motion)} · speaking ${esc(c.speaking)}</li>`).join('');
  return `<details><summary class="small muted">Stored analysis of this cut (what the app has today)</summary>
    <div class="small"><b>Composition:</b> ${esc(first.composition)}</div>
    ${rows ? `<div class="scroll"><table><thead><tr><th>character</th><th>pose</th><th>expression</th><th>emotion</th><th>gaze</th><th>action</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="muted small">No marked characters.</div>'}
    <div class="small" style="margin-top:6px"><b>Video:</b> ${esc(video.summary)}</div><ul class="tight small">${motion}</ul>
    <div class="muted small">Stored run times: first frame ${num(base.frame_seconds)} s, video ${num(base.video_seconds)} s.</div></details>`;
}
function sampleDetail(sample) {
  const approach = state.tab[sample.id] || AP[0];
  const tabs = AP.map((a) => `<button data-sample="${esc(sample.id)}" data-approach="${a}" class="${a === approach ? 'on' : ''} tag ${CLS[a]}">${esc(state.data.approaches[a].label)}</button>`).join('');
  const calls = callsOf(approach, sample.id);
  return `<div class="detail"><div class="cols"><div><img class="frame" src="runs/${esc(state.runId)}/${esc(sample.thumb)}" alt="">
      <div class="small muted" style="margin-top:6px">${sample.marked.map((m) => `<b>${esc(m.handle)}</b> ${esc(m.name)}`).join(' · ') || 'Nobody marked in the first frame.'}</div>${storedHtml(sample)}</div>
    <div><div class="tabs">${tabs}</div>${frameBlock(calls.normal, sample, 'normal')}${frameBlock(calls.mirror, sample, 'mirror')}${videoBlock(calls.video)}</div></div></div>`;
}
function renderSamples() {
  const shells = state.data.samples.map((sample) => `<details class="sample" data-id="${esc(sample.id)}" ${state.open.has(sample.id) ? 'open' : ''}><summary>${sampleSummary(sample)}</summary><div class="body">${state.open.has(sample.id) ? sampleDetail(sample) : ''}</div></details>`).join('');
  return `<h2>Samples (${state.data.samples.length} cuts)</h2><div class="muted small" style="margin-bottom:8px">Open a cut to see the frame, every attempt with its validator errors, the generated pose tables (red / green outline = a failed / passed check on that value), the flipped-frame result and the raw answers.</div><div id="samples">${shells}</div>`;
}
function refreshSamples() {
  const container = $('#samples');
  if (!container) return;
  for (const sample of state.data.samples) {
    const element = container.querySelector(`details[data-id="${CSS.escape(sample.id)}"]`);
    const signature = sampleSignature(sample.id);
    if (!element) continue;
    if (state.signatures[sample.id] === signature) continue;
    state.signatures[sample.id] = signature;
    element.querySelector('summary').innerHTML = sampleSummary(sample);
    if (state.open.has(sample.id)) element.querySelector('.body').innerHTML = sampleDetail(sample);
  }
}

// ---- wiring ----
function setIfChanged(selector, html) {
  const element = $(selector);
  if (!element || element.dataset.html === html) return;
  const opened = [...element.querySelectorAll('details[open]')].map((d) => d.dataset.keep).filter(Boolean);
  element.innerHTML = html;
  element.dataset.html = html;
  for (const key of opened) { const d = element.querySelector(`details[data-keep="${key}"]`); if (d) d.open = true; }
}
function renderAll() {
  renderStatus();
  const data = state.data;
  if (!data.samples || !data.samples.length) { $('#content').innerHTML = '<div class="empty muted">The cuts are still being chosen. This page refreshes by itself.</div>'; return; }
  if (!$('#samples')) {
    $('#content').innerHTML = '<div id="scoreboard"></div><div id="fields"></div><div id="samples-holder"></div>';
    $('#samples-holder').innerHTML = renderSamples();
    for (const sample of data.samples) state.signatures[sample.id] = sampleSignature(sample.id);
  }
  setIfChanged('#scoreboard', renderScoreboard());
  setIfChanged('#fields', renderFields());
  refreshSamples();
}
async function load() {
  clearTimeout(state.timer);
  try {
    state.data = await getJSON(`runs/${encodeURIComponent(state.runId)}/results.json`);
    renderAll();
  } catch (error) {
    $('#content').innerHTML = `<div class="empty muted">Could not read this run yet (${esc(error.message)}). Retrying…</div>`;
  }
  const status = state.data && state.data.progress && state.data.progress.status;
  if (!state.data || ['running', 'starting'].includes(status)) state.timer = setTimeout(load, 15000);
}
document.addEventListener('click', (event) => {
  const stage = event.target.closest('button[data-stage]');
  if (stage) { state.fieldStage = stage.dataset.stage; setIfChanged('#fields', renderFields()); return; }
  const tab = event.target.closest('button[data-approach]');
  if (tab) {
    event.preventDefault();
    state.tab[tab.dataset.sample] = tab.dataset.approach;
    const sample = state.data.samples.find((s) => s.id === tab.dataset.sample);
    tab.closest('.body').innerHTML = sampleDetail(sample);
    state.signatures[sample.id] = sampleSignature(sample.id);
  }
});
document.addEventListener('toggle', (event) => {
  const element = event.target;
  if (!(element instanceof HTMLDetailsElement) || !element.classList.contains('sample')) return;
  const id = element.dataset.id;
  if (element.open) {
    state.open.add(id);
    const sample = state.data.samples.find((s) => s.id === id);
    element.querySelector('.body').innerHTML = sampleDetail(sample);
  } else state.open.delete(id);
}, true);
$('#theme').addEventListener('click', () => {
  const root = document.documentElement, dark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#0f1218';
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('pose-theme', root.dataset.theme); } catch (error) { /* private window */ }
});
try { const saved = localStorage.getItem('pose-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (error) { /* ignore */ }
$('#run').addEventListener('change', (event) => { state.runId = event.target.value; state.open.clear(); state.signatures = {}; state.data = null; history.replaceState(null, '', '?run=' + encodeURIComponent(state.runId)); $('#content').innerHTML = ''; load(); });
(async function init() {
  try { state.runs = await getJSON('runs/index.json'); } catch (error) { state.runs = []; }
  const wanted = new URLSearchParams(location.search).get('run');
  state.runId = (state.runs.find((r) => r.id === wanted) || state.runs[0] || {}).id;
  $('#run').innerHTML = state.runs.map((r) => `<option value="${esc(r.id)}" ${r.id === state.runId ? 'selected' : ''}>${esc(r.id)} · ${esc(r.status || '')}${r.dry ? ' · dry' : ''}</option>`).join('');
  if (!state.runId) { $('#status').innerHTML = '<span class="muted">No run yet. Start one with <span class="mono">analysis_experiments/run.sh start</span>.</span>'; return; }
  load();
})();
</script>
</body>
</html>
